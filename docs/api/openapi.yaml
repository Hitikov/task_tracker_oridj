openapi: 3.1.0

info:
  title: Arij API
  version: 0.1.0
  summary: REST API трекера задач Arij
  description: |
    Контракт REST API сервера Arij. Источник истины для клиента и сервера:
    реализация этапа 1 должна соответствовать этому файлу.

    ## Формат ошибок

    Любая ошибка возвращается в едином конверте:

    ```json
    {
      "error": {
        "code": "validation_error",
        "message": "Некорректные данные запроса",
        "details": { "field": "email" }
      }
    }
    ```

    `code` — машиночитаемый код в snake_case, `message` — человекочитаемое
    сообщение, `details` — объект с дополнительным контекстом или `null`.
    HTTP-статус выбирается по смыслу ошибки, а не всегда 200.

    ## Аутентификация

    Защищённые операции требуют заголовок `Authorization: Bearer <JWT>`.
    Токен выдаётся `POST /api/v1/auth/register` и `POST /api/v1/auth/login`.
    Публичные операции: `GET /health`, регистрация и вход.

    ## Версионирование

    Прикладные операции находятся под `/api/v1`. `GET /health` намеренно
    расположен в корне, чтобы проверки контейнера не зависели от версии API.

    ## Задачи

    Этап 2 добавляет задачи Backlog: `Task`, `TaskCreate`, `TaskUpdate`,
    а также справочники проекта `TaskType` и `Status`. `kind`
    (epic/task/subtask — уровень иерархии) и `typeId` (bug/feature/custom —
    классификация) это разные измерения задачи и не смешиваются.
    Задача получает порядковый `number` в проекте; `key` вычисляется как
    `<key проекта>-<number>`, например `ARIJ-1`. Kanban появится на этапе 3.

    ## Документы

    - [ADR-0001: серверный стек](../adr/0001-backend-stack.md)
    - [Архитектура](../architecture.md)
    - [ROADMAP](../ROADMAP.md)
  contact:
    name: Arij
    url: https://github.com/Hitikov/task_tracker_oridj

servers:
  - url: http://localhost:8080
    description: Локальная разработка (Docker Compose или dart run)

tags:
  - name: Health
    description: Проверка доступности сервера
  - name: Auth
    description: Регистрация, вход и текущий пользователь
  - name: Projects
    description: Проекты и доступ пользователя к ним
  - name: Members
    description: Участники проекта
  - name: Tasks
    description: "Задачи Backlog: создание, просмотр, изменение, удаление"
  - name: Metadata
    description: Типы задач и статусы проекта

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Проверка живости сервера
      description: |
        Публичный endpoint для health-check Docker и мониторинга.
        Не требует аутентификации и не обращается к бизнес-логике.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  summary: Штатный ответ
                  value:
                    status: ok
                    service: arij-server
                    version: 0.1.0
                    time: '2026-11-15T12:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      description: |
        Создаёт пользователя и сразу возвращает JWT, чтобы клиент не делал
        отдельный вход после регистрации. Email уникален без учёта регистра.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            examples:
              register:
                summary: Регистрация нового пользователя
                value:
                  email: ada@example.com
                  password: correct-horse-battery-staple
                  name: Ада Лавлейс
      responses:
        '201':
          description: Пользователь создан, выдан JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                created:
                  summary: Успешная регистрация
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzZmE4NWY2NC01NzE3LTQ1NjItYjNmYy0yYzk2M2Y2NmFmYTYiLCJleHAiOjE3NjMyOTA0MDB9.example-signature
                    tokenType: Bearer
                    expiresIn: 86400
                    user:
                      id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      email: ada@example.com
                      name: Ада Лавлейс
                      createdAt: '2026-11-15T12:00:00.000Z'
                      updatedAt: '2026-11-15T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailTaken:
                  summary: Пользователь с таким email уже существует
                  value:
                    error:
                      code: email_taken
                      message: Пользователь с таким email уже существует
                      details:
                        field: email
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Вход по email и паролю
      description: Проверяет пароль и выдаёт новый JWT.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              login:
                summary: Вход существующего пользователя
                value:
                  email: ada@example.com
                  password: correct-horse-battery-staple
      responses:
        '200':
          description: Вход выполнен, выдан JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                loggedIn:
                  summary: Успешный вход
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzZmE4NWY2NC01NzE3LTQ1NjItYjNmYy0yYzk2M2Y2NmFmYTYiLCJleHAiOjE3NjMyOTA0MDB9.example-signature
                    tokenType: Bearer
                    expiresIn: 86400
                    user:
                      id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      email: ada@example.com
                      name: Ада Лавлейс
                      createdAt: '2026-11-15T12:00:00.000Z'
                      updatedAt: '2026-11-15T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  summary: Учётные данные не подошли
                  value:
                    error:
                      code: invalid_credentials
                      message: Неверный email или пароль
                      details: null
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      description: Возвращает пользователя, которому принадлежит переданный JWT.
      operationId: getCurrentUser
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                me:
                  summary: Профиль текущего пользователя
                  value:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    email: ada@example.com
                    name: Ада Лавлейс
                    createdAt: '2026-11-15T12:00:00.000Z'
                    updatedAt: '2026-11-15T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: Проекты текущего пользователя
      description: |
        Возвращает проекты, в которых пользователь является владельцем или
        участником. Сортировка — по `updatedAt` (сначала изменённые недавно).
        Пагинация в MVP не предусмотрена.
      operationId: listProjects
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              examples:
                projects:
                  summary: Два доступных проекта
                  value:
                    - id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                      key: ARIJ
                      name: Arij MVP
                      description: Трекер задач для учебного проекта
                      ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      createdAt: '2026-11-15T12:00:00.000Z'
                      updatedAt: '2026-11-15T12:00:00.000Z'
                    - id: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
                      key: DEMO
                      name: Демо-проект
                      description: null
                      ownerId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                      createdAt: '2026-11-14T09:30:00.000Z'
                      updatedAt: '2026-11-14T09:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Projects]
      summary: Создать проект
      description: |
        Создаёт проект, делает текущего пользователя владельцем и добавляет его
        в `project_members` с ролью `owner`. Ключ проекта уникален глобально и
        в дальнейшем не меняется — он используется в номерах задач (`ARIJ-1`).
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            examples:
              create:
                summary: Новый проект
                value:
                  key: ARIJ
                  name: Arij MVP
                  description: Трекер задач для учебного проекта
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                created:
                  summary: Созданный проект
                  value:
                    id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                    key: ARIJ
                    name: Arij MVP
                    description: Трекер задач для учебного проекта
                    ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    createdAt: '2026-11-15T12:00:00.000Z'
                    updatedAt: '2026-11-15T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ключ проекта уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                projectKeyTaken:
                  summary: Проект с таким ключом уже существует
                  value:
                    error:
                      code: project_key_taken
                      message: Проект с таким ключом уже существует
                      details:
                        field: key
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Проект по идентификатору
      description: Доступен владельцу и участникам проекта.
      operationId: getProject
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                project:
                  summary: Карточка проекта
                  value:
                    id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                    key: ARIJ
                    name: Arij MVP
                    description: Трекер задач для учебного проекта
                    ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    createdAt: '2026-11-15T12:00:00.000Z'
                    updatedAt: '2026-11-15T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Projects]
      summary: Обновить проект
      description: |
        Частичное обновление. Менять можно `name` и `description`; `key`
        неизменяем. Доступно только владельцу проекта.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
            examples:
              rename:
                summary: Переименование и новое описание
                value:
                  name: Arij MVP 2.0
                  description: Трекер задач с Kanban
      responses:
        '200':
          description: Проект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                updated:
                  summary: Обновлённый проект
                  value:
                    id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                    key: ARIJ
                    name: Arij MVP 2.0
                    description: Трекер задач с Kanban
                    ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    createdAt: '2026-11-15T12:00:00.000Z'
                    updatedAt: '2026-11-15T13:45:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Projects]
      summary: Удалить проект
      description: |
        Удаляет проект и связанных участников. Доступно только владельцу.
        Задачи на этапе 2 будут удаляться каскадно вместе с проектом.
      operationId: deleteProject
      responses:
        '204':
          description: Проект удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      summary: Участники проекта
      description: Доступно владельцу и участникам проекта.
      operationId: listProjectMembers
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
              examples:
                members:
                  summary: Владелец и участник
                  value:
                    - userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      email: ada@example.com
                      name: Ада Лавлейс
                      role: owner
                      joinedAt: '2026-11-15T12:00:00.000Z'
                    - userId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                      email: member@example.com
                      name: Иван Петров
                      role: member
                      joinedAt: '2026-11-15T12:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Members]
      summary: Добавить участника
      description: |
        Добавляет существующего пользователя в проект по email. Доступно только
        владельцу. Повторное добавление возвращает `409 member_exists`.
      operationId: addProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdd'
            examples:
              addMember:
                summary: Добавление участника
                value:
                  email: member@example.com
      responses:
        '201':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
              examples:
                added:
                  summary: Новый участник проекта
                  value:
                    userId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                    email: member@example.com
                    name: Иван Петров
                    role: member
                    joinedAt: '2026-11-15T12:30:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Проект или пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                projectNotFound:
                  summary: Проект не найден
                  value:
                    error:
                      code: project_not_found
                      message: Проект не найден
                      details:
                        resource: project
                        id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                userNotFound:
                  summary: Пользователь с таким email не зарегистрирован
                  value:
                    error:
                      code: user_not_found
                      message: Пользователь не найден
                      details:
                        field: email
                        email: member@example.com
        '409':
          description: Пользователь уже участвует в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                memberExists:
                  summary: Повторное добавление
                  value:
                    error:
                      code: member_exists
                      message: Пользователь уже участвует в проекте
                      details:
                        userId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Members]
      summary: Удалить участника
      description: |
        Удаляет участника из проекта. Доступно только владельцу. Владельца
        удалить нельзя — сначала нужно передать владение (post-MVP).
      operationId: removeProjectMember
      responses:
        '204':
          description: Участник удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Проект или участник не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                projectNotFound:
                  summary: Проект не найден
                  value:
                    error:
                      code: project_not_found
                      message: Проект не найден
                      details:
                        resource: project
                        id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                memberNotFound:
                  summary: Участник не найден
                  value:
                    error:
                      code: member_not_found
                      message: Участник не найден
                      details:
                        resource: project_member
                        userId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
        '409':
          description: Нельзя удалить владельца проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ownerRemovalForbidden:
                  summary: Попытка удалить владельца
                  value:
                    error:
                      code: owner_removal_forbidden
                      message: Нельзя удалить владельца проекта
                      details:
                        userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        '500':
          $ref: '#/components/responses/InternalError'

  # --- Этап 2: задачи и справочники проекта ---
  /api/v1/projects/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: Задачи проекта (Backlog)
      description: |
        Возвращает задачи проекта, отсортированные по `number`
        (порядок создания). Доступно владельцу и участникам проекта.
        Пагинация в MVP не предусмотрена.
      operationId: listProjectTasks
      responses:
        '200':
          description: Список задач проекта
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
              examples:
                tasks:
                  summary: Epic с вложенной задачей и сабтаском
                  value:
                    - id: 11111111-2222-4333-8444-555555555555
                      projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                      number: 1
                      key: ARIJ-1
                      kind: epic
                      typeId: 66666666-7777-4888-9999-000000000001
                      statusId: 66666666-7777-4888-9999-000000000002
                      title: Ядро MVP
                      description: Сквозной сценарий этапа 2
                      priority: high
                      assigneeId: null
                      reporterId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      parentId: null
                      dueDate: null
                      createdAt: '2026-11-29T10:00:00.000Z'
                      updatedAt: '2026-11-29T10:00:00.000Z'
                    - id: 11111111-2222-4333-8444-555555555556
                      projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                      number: 2
                      key: ARIJ-2
                      kind: task
                      typeId: 66666666-7777-4888-9999-000000000001
                      statusId: 66666666-7777-4888-9999-000000000002
                      title: CRUD задач на сервере
                      description: null
                      priority: medium
                      assigneeId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                      reporterId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      parentId: 11111111-2222-4333-8444-555555555555
                      dueDate: '2026-12-05'
                      createdAt: '2026-11-29T10:05:00.000Z'
                      updatedAt: '2026-11-29T10:05:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tasks]
      summary: Создать задачу
      description: |
        Создаёт задачу в проекте. `number` назначается сервером как
        `max(number) + 1` в проекте и не меняется. По умолчанию берутся
        статус проекта по умолчанию (`To Do`), тип `feature` (если `typeId`
        не передан) и приоритет `medium`.

        Иерархия: `epic` создаётся без `parentId`; `task` — без `parentId`
        или с `parentId` на `epic`; `subtask` — только с `parentId` на `task`.
        Нарушение возвращает `409 task_hierarchy_invalid`.
      operationId: createProjectTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            examples:
              createTask:
                summary: Задача внутри эпика
                value:
                  kind: task
                  title: CRUD задач на сервере
                  description: Миграции, маршруты и валидация
                  priority: high
                  assigneeId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                  parentId: 11111111-2222-4333-8444-555555555555
                  dueDate: '2026-12-05'
              createEpic:
                summary: Эпик без родителя
                value:
                  kind: epic
                  title: Ядро MVP
                  priority: critical
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                created:
                  summary: Созданная задача
                  value:
                    id: 11111111-2222-4333-8444-555555555556
                    projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                    number: 2
                    key: ARIJ-2
                    kind: task
                    typeId: 66666666-7777-4888-9999-000000000001
                    statusId: 66666666-7777-4888-9999-000000000002
                    title: CRUD задач на сервере
                    description: Миграции, маршруты и валидация
                    priority: high
                    assigneeId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                    reporterId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    parentId: 11111111-2222-4333-8444-555555555555
                    dueDate: '2026-12-05'
                    createdAt: '2026-11-29T10:05:00.000Z'
                    updatedAt: '2026-11-29T10:05:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: Нарушена иерархия задач или ссылка вне проекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hierarchyInvalid:
                  summary: Subtask без родителя-задачи
                  value:
                    error:
                      code: task_hierarchy_invalid
                      message: Subtask может быть вложен только в task
                      details:
                        field: parentId
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
