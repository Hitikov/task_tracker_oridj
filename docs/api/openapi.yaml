        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Tasks]
      summary: Обновить задачу
      description: |
        Частичное обновление. Менять можно `kind`, `typeId`, `statusId`,
        `title`, `description`, `priority`, `assigneeId`, `parentId` и
        `dueDate`; `projectId`, `number` и `key` неизменяемы, `reporterId`
        остаётся автором задачи. Смена `kind`/`parentId` проверяется по
        тем же правилам иерархии, что и создание.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
            examples:
              reassign:
                summary: Новый исполнитель и дедлайн
                value:
                  assigneeId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                  dueDate: '2026-12-05'
              rename:
                summary: Переименование и смена приоритета
                value:
                  title: CRUD задач на сервере (v2)
                  priority: critical
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                updated:
                  summary: Обновлённая задача
                  value:
                    id: 11111111-2222-4333-8444-555555555556
                    projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                    number: 2
                    key: ARIJ-2
                    kind: task
                    typeId: 66666666-7777-4888-9999-000000000001
                    statusId: 66666666-7777-4888-9999-000000000002
                    title: CRUD задач на сервере (v2)
                    description: Миграции, маршруты и валидация
                    priority: critical
                    assigneeId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f
                    reporterId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    parentId: 11111111-2222-4333-8444-555555555555
                    dueDate: '2026-12-05'
                    createdAt: '2026-11-29T10:05:00.000Z'
                    updatedAt: '2026-11-29T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          description: Нарушена иерархия задач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hierarchyInvalid:
                  summary: Epic с родителем
                  value:
                    error:
                      code: task_hierarchy_invalid
                      message: Epic не может иметь родителя
                      details:
                        field: parentId
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Удалить задачу
      description: |
        Удаляет задачу вместе с подзадачами (каскадно по `parentId`).
        Типы и статусы при этом не удаляются.
      operationId: deleteTask
      responses:
        '204':
          description: Задача удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{id}/task-types:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Metadata]
      summary: Типы задач проекта
      description: |
        Возвращает типы проекта. Базовые типы `bug`, `feature` и `custom`
        создаются для каждого проекта автоматически; `kind` (epic/task/subtask)
        сюда не входит — это другое измерение задачи.
      operationId: listProjectTaskTypes
      responses:
        '200':
          description: Список типов задач
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskType'
              examples:
                taskTypes:
                  summary: Базовые типы проекта
                  value:
                    - id: 66666666-7777-4888-9999-000000000001
                      projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                      name: bug
                      createdAt: '2026-11-29T09:00:00.000Z'
                    - id: 66666666-7777-4888-9999-000000000003
                      projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                      name: feature
                      createdAt: '2026-11-29T09:00:00.000Z'
                    - id: 66666666-7777-4888-9999-000000000004
                      projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
                      name: custom
                      createdAt: '2026-11-29T09:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{id}/statuses:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Metadata]
      summary: Статусы проекта
      description: |
        Возвращает статусы проекта в порядке `position`. Базовые статусы
        `To Do`, `In Progress` и `Done` создаются для каждого проекта
        автоматически; `isDefault` помечает статус, с которым создаётся
        новая задача.
      operationId: listProjectStatuses
      responses:
        '200':
          description: Список статусов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Status'
              examples:
                statuses:
                  summary: Базовые статусы проекта
                  value:
                    - id: 66666666-7777-4888-9999-000000000002
                      projectId: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
