        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT, выданный `POST /api/v1/auth/register` или `POST /api/v1/auth/login`.
        Передаётся как `Authorization: Bearer <token>`.

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: UUID проекта
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: UUID пользователя-участника
      schema:
        type: string
        format: uuid
    TaskId:
      name: id
      in: path
      required: true
      description: UUID задачи
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validationError:
              summary: Ошибка валидации поля
              value:
                error:
                  code: validation_error
                  message: Некорректные данные запроса
                  details:
                    field: email
    Unauthorized:
      description: Аутентификация не пройдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: JWT отсутствует, просрочен или неверен
              value:
                error:
                  code: unauthorized
                  message: Требуется аутентификация
                  details: null
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              summary: Операция недоступна роли пользователя
              value:
                error:
                  code: forbidden
                  message: Недостаточно прав для выполнения операции
                  details:
                    requiredRole: owner
    ProjectNotFound:
      description: Проект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            projectNotFound:
              summary: Проект отсутствует или недоступен
              value:
                error:
                  code: project_not_found
                  message: Проект не найден
                  details:
                    resource: project
                    id: b7e6c1d2-4a3f-4c5d-8e9f-0a1b2c3d4e5f
    TaskNotFound:
      description: Задача не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            taskNotFound:
              summary: Задача отсутствует или недоступна
              value:
                error:
                  code: task_not_found
                  message: Задача не найдена
                  details:
                    resource: task
                    id: 11111111-2222-4333-8444-555555555556
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              summary: Непредвиденная ошибка
              value:
                error:
                  code: internal_error
                  message: Внутренняя ошибка сервера
                  details: null

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetails'
      examples:
        - error:
            code: validation_error
            message: Некорректные данные запроса
            details:
              field: email

    ErrorDetails:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |
            Машиночитаемый код ошибки в snake_case. Примеры:
            `validation_error`, `unauthorized`, `invalid_credentials`,
            `forbidden`, `project_not_found`, `member_not_found`,
            `user_not_found`, `task_not_found`, `task_hierarchy_invalid`,
            `email_taken`, `project_key_taken`,
            `member_exists`, `owner_removal_forbidden`, `internal_error`.
          examples:
            - validation_error
        message:
          type: string
          description: Человекочитаемое сообщение, пригодное для показа пользователю
          examples:
            - Некорректные данные запроса
        details:
          type: [object, 'null']
          description: |
            Дополнительный контекст: имя поля, идентификатор ресурса и т. п.
            Если контекста нет — `null`. Не содержит секретов и stack trace.
          additionalProperties: true
          examples:
            - field: email

    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, time]
      properties:
        status:
          type: string
          enum: [ok]
          description: Состояние сервера
          examples:
            - ok
        service:
          type: string
          description: Имя сервиса
          examples:
            - arij-server
        version:
          type: string
          description: Версия API
          pattern: '^\d+\.\d+\.\d+$'
          examples:
            - 0.1.0
        time:
          type: string
          format: date-time
          description: Текущее время сервера в UTC (ISO 8601)
          examples:
            - '2026-11-15T12:00:00.000Z'

    User:
      type: object
      additionalProperties: false
      required: [id, email, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    AuthRegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Уникальный email, регистр не учитывается
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 128
          description: Пароль в открытом виде только в запросе; хранится как Argon2id/bcrypt-хэш
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Отображаемое имя пользователя

    AuthLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128

    AuthResponse:
      type: object
      additionalProperties: false
      required: [token, tokenType, expiresIn, user]
      properties:
        token:
          type: string
          description: Подписанный JWT
        tokenType:
          type: string
          enum: [Bearer]
          description: Схема передачи токена
        expiresIn:
          type: integer
          minimum: 1
          description: Время жизни токена в секундах
        user:
          $ref: '#/components/schemas/User'

    Project:
      type: object
      additionalProperties: false
      required: [id, key, name, description, ownerId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          description: |
            Короткий ключ проекта для номеров задач (`ARIJ-1`). Уникален
            глобально, состоит из заглавных латинских букв и цифр, не меняется.
          pattern: '^[A-Z][A-Z0-9]{1,9}$'
          minLength: 2
          maxLength: 10
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        ownerId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    ProjectCreate:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          description: Уникальный ключ проекта; приводится к верхнему регистру
          pattern: '^[A-Za-z][A-Za-z0-9]{1,9}$'
          minLength: 2
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000

    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Частичное обновление; `key` и `ownerId` изменить нельзя
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000

    ProjectMember:
      type: object
      additionalProperties: false
      required: [userId, email, name, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [owner, member]
          description: Роль в проекте; на этапе 1 доступны owner и member
        joinedAt:
          type: string
          format: date-time

    MemberAdd:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Email уже зарегистрированного пользователя
        role:
          type: string
          enum: [member]
          default: member
          description: |
            На этапе 1 новый участник всегда получает роль `member`.
            Передача владения и назначение второго `owner` — post-MVP.

    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - number
        - key
        - kind
        - typeId
        - statusId
        - title
        - description
        - priority
        - assigneeId
        - reporterId
        - parentId
        - dueDate
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        projectId:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          minimum: 1
          readOnly: true
          description: Порядковый номер задачи в проекте, уникален в пределах проекта
        key:
          type: string
          readOnly: true
          description: |
            Человекочитаемый ключ задачи: `<key проекта>-<number>`,
            например `ARIJ-1`. Вычисляется на сервере, не редактируется.
          pattern: '^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]*$'
          examples:
            - ARIJ-1
        kind:
          type: string
          enum: [epic, task, subtask]
          description: |
            Уровень иерархии (отдельное измерение от `typeId`): `epic` без
            родителя, `task` — без родителя или внутри `epic`, `subtask` —
            только внутри `task`.
        typeId:
          type: string
          format: uuid
          description: |
            Классификация задачи (bug/feature/custom) — тип из справочника
            проекта; отдельное измерение от `kind`. Тип чужого проекта
            принять нельзя.
        statusId:
          type: string
          format: uuid
          description: Текущий статус задачи; статус должен принадлежать тому же проекту
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 5000
        priority:
          type: string
          enum: [low, medium, high, critical]
        assigneeId:
          type: [string, 'null']
          format: uuid
          description: Исполнитель; `null`, если не назначен
        reporterId:
          type: string
          format: uuid
          readOnly: true
          description: Автор задачи; при удалении пользователя задачи не удаляются
        parentId:
          type: [string, 'null']
          format: uuid
          description: |
            Родительская задача по правилам `kind`; `null` для `epic` и
            корневых `task`. Удаление родителя удаляет подзадачи.
        dueDate:
          type: [string, 'null']
          format: date
          description: Дедлайн (дата без времени); `null`, если не задан
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    TaskCreate:
      type: object
      additionalProperties: false
      required: [kind, title]
      description: |
        Создание задачи. `projectId`, `number`, `key`, `reporterId`,
        `createdAt` и `updatedAt` назначает сервер; статус по умолчанию —
        статус проекта с `isDefault`, тип по умолчанию — `feature`.
      properties:
        kind:
          type: string
          enum: [epic, task, subtask]
        typeId:
          type: string
          format: uuid
          description: Тип задачи; по умолчанию `feature` проекта
        statusId:
          type: string
          format: uuid
          description: Статус; по умолчанию статус проекта с `isDefault` (`To Do`)
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 5000
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
        assigneeId:
          type: [string, 'null']
          format: uuid
          description: Исполнитель должен быть участником проекта
        parentId:
          type: [string, 'null']
          format: uuid
          description: Родительская задача того же проекта, допустимая для `kind`
        dueDate:
          type: [string, 'null']
          format: date
      examples:
        - kind: task
          title: CRUD задач на сервере
          priority: high
          parentId: 11111111-2222-4333-8444-555555555555

    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Частичное обновление. `projectId`, `number`, `key`, `reporterId` и
        временные метки изменить нельзя.
      properties:
        kind:
          type: string
          enum: [epic, task, subtask]
        typeId:
          type: string
          format: uuid
        statusId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 5000
        priority:
          type: string
          enum: [low, medium, high, critical]
        assigneeId:
          type: [string, 'null']
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        dueDate:
          type: [string, 'null']
          format: date
      examples:
        - priority: critical
          assigneeId: c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f

    TaskType:
      type: object
      additionalProperties: false
      required: [id, projectId, name, createdAt]
      description: |
        Тип задачи проекта — измерение `typeId` (bug/feature/custom),
        не путать с `kind` (epic/task/subtask).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        projectId:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Название типа, уникально в пределах проекта
          examples:
            - bug
        createdAt:
          type: string
          format: date-time
          readOnly: true

    Status:
      type: object
      additionalProperties: false
      required: [id, projectId, name, position, isDefault, createdAt]
      description: Статус задачи проекта; задаёт колонку Backlog/Kanban.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        projectId:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Название статуса, уникально в пределах проекта
          examples:
            - To Do
        position:
          type: integer
          minimum: 0
          description: Порядок статуса в проекте, уникален в пределах проекта
        isDefault:
          type: boolean
          description: |
            Статус, с которым создаётся новая задача; у проекта ровно один
            такой статус.
        createdAt:
          type: string
          format: date-time
          readOnly: true
