name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Отменяем предыдущие запускы в рамках того же PR, чтобы не тратить ресурсы
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
          cache-key: "os:-flutter:-v1:pubspec-hash:${{ hashFiles('**/pubspec.lock') }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format .

      - name: Check for uncommitted changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format dart code"
          file_pattern: "*.dart"

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test
