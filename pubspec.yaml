name: task_tracker_oridj
description: A cross-platform task tracking application using Flutter and Drift/PostgreSQL.

# === *** ЭТО БЛОК КОНСТАНТНОЙ СРЕДЫ (ОБЯЗАТЕЛЬНО НА САМОМ ВЕРХУ) *** ==#
environment:
  sdk: '>=3.0.0 <4.0.0' # Ограничение SDK для стабильности

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  uuid: ^4.3.0
  path_provider: ^2.1.2  # <--- Вот этот пакет нужен для поиска папки с БД
  dotenv: ^4.2.0 # Для загрузки переменных окружения из .env файла
  drift: ^2.0.0   # ORM для работы с БД (Сложно, но надежно)
  postgres: ^2.0.0 # PostgreSQL драйвер для Drift/Dart
  shelf: ^1.3.0   # HTTP-серверный фреймворк
  shelf_router: ^1.1.2 # Для маршрутизации API в Shelf

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.0.0 # Генератор кода для работы с БД (Обязательно!)
  build_runner: ^2.4.8 # Инструмент для запуска генератора кода (Обязательно!)